services:
  - type: web
    name: wardrobe-app-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false  # Render sets this automatically
      - key: OPENAI_API_KEY
        sync: false  # Set this in Render dashboard
      - key: PEXELS_API_KEY
        sync: false  # Optional - set this in Render dashboard
    disk:
      name: wardrobe-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

